name: Poker foundation checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run build
      - run: unzip -t dist/poker.xdc
      - uses: actions/upload-artifact@v4
        with:
          name: poker-xdc-prototype
          path: dist/poker.xdc
