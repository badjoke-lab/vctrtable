name: Publish Poker WebXDC preview
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poker-preview-release
  cancel-in-progress: false

jobs:
  release-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run build
      - run: unzip -t dist/poker.xdc
      - name: Create or update preview prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep metadata honest as capabilities change, including on
          # repeat preview uploads: this is host-trusted alpha, not secure PvP.
          PREVIEW_TITLE="Poker preview — Solo practice and experimental PvP"
          PREVIEW_NOTES="Experimental host-trusted WebXDC poker: signed seat-key actions, encrypted hands and host-enforced turn clock. Host can access the full deck; Vector identity is NOT authenticated and real-device delivery is unverified. No money, cash-out, prizes or wagering. Not production-secure multiplayer."
          if ! gh release view poker-preview >/dev/null 2>&1; then
            gh release create poker-preview \
              --target "${GITHUB_SHA}" \
              --title "${PREVIEW_TITLE}" \
              --notes "${PREVIEW_NOTES}" \
              --prerelease
          else
            gh release edit poker-preview \
              --target "${GITHUB_SHA}" \
              --title "${PREVIEW_TITLE}" \
              --notes "${PREVIEW_NOTES}" \
              --prerelease
          fi
          gh release upload poker-preview dist/poker.xdc --clobber
          echo "Preview download: https://github.com/${GITHUB_REPOSITORY}/releases/download/poker-preview/poker.xdc" >> "${GITHUB_STEP_SUMMARY}"
