name: Mobile Poker browser smoke
on:
  pull_request:
    paths:
      - 'apps/poker/**'
      - 'packages/poker/**'
      - 'scripts/browser-smoke.mjs'
      - 'scripts/shared-lobby-browser-smoke.mjs'
      - 'scripts/build.mjs'
      - '.github/workflows/browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'apps/poker/**'
      - 'packages/poker/**'
      - 'scripts/browser-smoke.mjs'
      - 'scripts/build.mjs'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run build
      - name: Install browser testing tools
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test phone-width Poker UI in Chromium
        run: node scripts/browser-smoke.mjs
      - name: Simulate two Vector chat participants joining the same packaged lobby
        run: node scripts/shared-lobby-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poker-mobile-browser-screenshots
          path: |
            dist/poker-mobile-*.png
            dist/poker-shared-lobby-*.png
            dist/poker-river-*.png
          if-no-files-found: ignore
