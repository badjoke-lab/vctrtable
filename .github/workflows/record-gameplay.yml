name: Record actual Poker gameplay
on:
  push:
    branches:
      - media/poker-playthrough-capture-20261115
    paths:
      - 'scripts/record-gameplay.mjs'
      - '.github/workflows/record-gameplay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - name: Install Chromium capture tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Record real game from packaged XDC
        run: node scripts/record-gameplay.mjs
      - name: Convert browser recordings to shareable MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y -i dist/poker-gameplay-desktop.webm -c:v libx264 -preset medium -crf 22 -pix_fmt yuv420p -movflags +faststart -an dist/poker-gameplay-desktop.mp4
          ffmpeg -hide_banner -loglevel error -y -i dist/poker-gameplay-mobile.webm -c:v libx264 -preset medium -crf 22 -pix_fmt yuv420p -movflags +faststart -an dist/poker-gameplay-mobile.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 dist/poker-gameplay-desktop.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 dist/poker-gameplay-mobile.mp4
      - name: Upload actual game capture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poker-real-gameplay-videos
          path: |
            dist/poker-gameplay-desktop.mp4
            dist/poker-gameplay-mobile.mp4
            dist/poker-gameplay-cover-desktop.png
            dist/poker-gameplay-cover-mobile.png
          if-no-files-found: warn
