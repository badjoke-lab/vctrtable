[package]
name = "vctrtable-vector-bot"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
vector_sdk = "=0.11.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OS-level advisory flock lock, released automatically on process exit/crash.
fs2 = "0.4"
